[package]
name = "dyad-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The dyad-prism trust core, generated by lean4-prod from the Lean verified model in src/*.lex.tex, with PrismPM's archive composer vendored verbatim. Do not edit generated code."
repository = "https://github.com/humuhumu33/dyad-prism"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# The browser boundary and the page projector speak JSON; the model does not.
serde_json = "1"
# PrismPM's archive code (core/src/holo/, verbatim from the pinned commit) composes the .holo on the
# same crates PrismPM builds on: uor-hologram at the revision PrismPM's Cargo.toml pins.
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hologram = { package = "uor-hologram", version = "0.12.1", git = "https://github.com/Hologram-Technologies/hologram", rev = "2bda6a9a9476872dade705bd61ece4209607f6da", default-features = false, features = ["archive", "space"] }

[[bin]]
name = "project-shell"
path = "src/bin/project_shell.rs"

[dev-dependencies]

[workspace]
